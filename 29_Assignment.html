<!--Q29. Style a landing-page hero section using position and z-index.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section - Positioning & Z-Index</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }

        /* ----------------------------------------------------
           1. FIXED NAVBAR (Stays on top during scroll)
           ---------------------------------------------------- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 50px;
            z-index: 100; /* Stays above all hero layers */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-weight: bold;
            font-size: 1.4rem;
            color: #38bdf8;
        }

        /* ----------------------------------------------------
           2. HERO SECTION CONTAINER (Position Context)
           ---------------------------------------------------- */
        .hero {
            position: relative; /* Relative container for absolute children */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            overflow: hidden;
            background-image: url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
        }

        /* 3. OVERLAY LAYER (Behind content, above background image) */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.7) 100%);
            z-index: 1; /* Layer 1 */
        }

        /* 4. HERO CONTENT (Above dark overlay) */
        .hero-content {
            position: relative;
            z-index: 2; /* Layer 2 */
            text-align: center;
            max-width: 700px;
        }

        .hero-title {
            font-size: 3rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-title span {
            color: #38bdf8;
        }

        .hero-desc {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .btn-cta {
            background-color: #0284c7;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            background-color: #0369a1;
        }

        /* ----------------------------------------------------
           5. FLOATING BADGE (Absolute relative to Hero)
           ---------------------------------------------------- */
        .floating-badge {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 3; /* Layer 3 - Overlays content */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <!-- Fixed Header -->
    <header class="navbar">
        <div class="logo">SADMYN</div>
        <button class="btn-cta" style="padding: 8px 20px;">Contact</button>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Background Overlay Layer -->
        <div class="hero-overlay"></div>

        <!-- Main Hero Text Content -->
        <div class="hero-content">
            <h1 class="hero-title">Build Modern Websites <span>Faster</span></h1>
            <p class="hero-desc">Master HTML5, CSS Positioning, Flexbox, and Grid to construct beautiful responsive interfaces.</p>
            <button class="btn-cta">Get Started Today</button>
        </div>

        <!-- Floating UI Card / Badge -->
        <div class="floating-badge">
            <p style="font-size: 0.85rem; color: #38bdf8; font-weight: bold;">⚡ Live Status</p>
            <p style="font-size: 0.95rem;">Positioning & Z-Index Mastered</p>
        </div>
    </section>

</body>
</html>
