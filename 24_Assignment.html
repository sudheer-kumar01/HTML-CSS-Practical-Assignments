<!--Q24. Create a small design-token stylesheet (colours, font sizes) using CSS variables.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens with CSS Variables</title>
    <style>
        /* ----------------------------------------------------
           DESIGN TOKENS (CSS Custom Properties)
           ---------------------------------------------------- */
        :root {
            /* Color Tokens */
            --color-primary: #4f46e5;
            --color-primary-hover: #4338ca;
            --color-secondary: #06b6d4;
            --color-bg-main: #f8fafc;
            --color-bg-card: #ffffff;
            --color-text-main: #0f172a;
            --color-text-muted: #64748b;
            --color-border: #e2e8f0;

            /* Typography Tokens */
            --font-family-base: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --font-size-xs: 0.75rem;   /* 12px */
            --font-size-sm: 0.875rem;  /* 14px */
            --font-size-md: 1rem;      /* 16px */
            --font-size-lg: 1.25rem;   /* 20px */
            --font-size-xl: 1.75rem;   /* 28px */
            --font-size-2xl: 2.25rem;  /* 36px */

            /* Spacing Tokens */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;

            /* Borders & Shadows */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 16px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* ----------------------------------------------------
           USING TOKENS IN STYLES
           ---------------------------------------------------- */
        body {
            font-family: var(--font-family-base);
            background-color: var(--color-bg-main);
            color: var(--color-text-main);
            padding: var(--space-xl);
            margin: 0;
        }

        .card {
            background-color: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-lg);
            max-width: 400px;
            margin: 0 auto;
            box-shadow: var(--shadow-md);
        }

        .card-tag {
            font-size: var(--font-size-xs);
            color: var(--color-secondary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: var(--font-size-xl);
            margin-top: var(--space-xs);
            margin-bottom: var(--space-sm);
        }

        .card-description {
            font-size: var(--font-size-md);
            color: var(--color-text-muted);
            line-height: 1.5;
            margin-bottom: var(--space-lg);
        }

        .btn-primary {
            background-color: var(--color-primary);
            color: #ffffff;
            font-size: var(--font-size-sm);
            padding: var(--space-sm) var(--space-md);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--color-primary-hover);
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="card-tag">CSS Variables</span>
        <h2 class="card-title">Design Tokens Demo</h2>
        <p class="card-description">
            Design tokens variables define colors, sizes, and spacing centrally. Direct edits inside <code>:root</code> instantly reflect across the entire application.
        </p>
        <button class="btn-primary">Learn More</button>
    </div>

</body>
</html>
