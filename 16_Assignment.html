<!--Q16. Create a student-registration form using basic input types.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Ragistration Form</title>
</head>
<body>
    <header>
        <h1>Student Ragistration Form</h1>
        <p>Please fill this form to register for the BCA AI course.</p>
    </header>

    <hr>

    <main>
        <form action="">
            <!-- 1. Full Name (Text Input) -->
            <div>
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" placeholder="Enter Your full name" required>
            </div>

            <br>

            <!-- 2. Email Address (Email Input) -->
             <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="example@email.com" required>
             </div>
             
             <br>

             <!-- 3. Phone Number (Number Input) -->
              <div>
                <label for="phone">Phone Number:</label>
                <input type="number" id="phone" placeholder="Enter mobile number">
              </div>

              <br>

              <!-- 4. Create Password (Password Input) -->
               <div>
                <label for="password">Creat Password:</label>
                <input type="password" id="password" placeholder="Min 6 charecters" required>
               </div>

               <br>

               <!-- 5. Submit Button -->
                <div>
                    <button type="submit">Submit Registration</button>
                </div>
        </form>
    </main>
</body>
</html>
