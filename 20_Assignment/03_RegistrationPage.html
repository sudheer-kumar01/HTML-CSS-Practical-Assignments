<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Registration Form Page">
    <title>Registration - HTML Project</title>
</head>
<body>
    <header>
        <h1>Student Registration</h1>
        <nav>
            <a href="01_HomePage.html">Home</a> | 
            <a href="02_AboutPage.html">About</a> | 
            <a href="03_RegistrationPage.html">Registration</a> | 
            <a href="04_ContactPage.html">Contact</a>
        </nav>
        <hr>
    </header>

    <main>
        <form action="#" method="POST">
            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob"><br><br>

                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label><br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Course Preferences</legend>

                <label for="course">Select Course:</label><br>
                <select id="course" name="course">
                    <option value="html-css">HTML & CSS Masterclass</option>
                    <option value="javascript">JavaScript Fundamentals</option>
                    <option value="react">React Web App Development</option>
                </select><br><br>

                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms and conditions</label><br><br>
            </fieldset>

            <br>
            <button type="submit">Submit Registration</button>
            <button type="reset">Reset Form</button>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Web Development Assignment | All Rights Reserved</p>
    </footer>
</body>
</html>
