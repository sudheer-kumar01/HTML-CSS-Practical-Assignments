<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <header>
        <h1>Contact Us</h1>
        <nav>
            <a href="01_HomePage.html">Home</a> | 
            <a href="02_AboutPage.html">About</a> | 
            <a href="03_RegistrationPage.html">Registration</a> | 
            <a href="04_ContactPage.html">Contact</a>
        </nav>
        <hr>
    </header>

    <main>
        <section>
            <h2>Get In Touch</h2>
            <p><strong>Email:</strong> support@example.com</p>
            <p><strong>Phone:</strong> +91 98765 43210</p>
            <p><strong>Address:</strong> Tech Campus, New Delhi, India</p>
        </section>

        <section>
            <h2>Send Us a Message</h2>
            <form action="#" method="POST">
                <label for="cname">Name:</label><br>
                <input type="text" id="cname" name="cname" required><br><br>

                <label for="cemail">Email:</label><br>
                <input type="email" id="cemail" name="cemail" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="40" placeholder="Type your message here..." required></textarea><br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
