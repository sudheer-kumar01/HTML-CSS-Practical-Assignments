<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Component</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card Container (Box Model + Relative Context) */
        .product-card {
            position: relative;
            width: 320px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
        }

        /* Absolute Badge Positioning */
        .badge {
            position: absolute;
            top: 28px;
            left: 28px;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Image Box Model Frame */
        .image-container {
            width: 100%;
            height: 220px;
            background-color: #f8fafc;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        /* Product Details */
        .category {
            font-size: 0.8rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .title {
            font-size: 1.15rem;
            color: #0f172a;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 16px;
        }

        .current-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0284c7;
        }

        .original-price {
            font-size: 0.95rem;
            color: #94a3b8;
            text-decoration: line-through;
        }

        /* CTA Button */
        .btn-add-cart {
            width: 100%;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-add-cart:hover {
            background-color: #0284c7;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <!-- Floating Badge -->
        <span class="badge">Sale 20% Off</span>

        <!-- Image Frame -->
        <div class="image-container">
            <img src="https://via.placeholder.com/280x200/e2e8f0/0f172a?text=Wireless+Headphones" alt="Wireless Headphones">
        </div>

        <!-- Info Area -->
        <p class="category">Audio Electronics</p>
        <h3 class="title">Pro Wireless Noise-Canceling Headphones</h3>
        
        <div class="price-row">
            <span class="current-price">₹4,999</span>
            <span class="original-price">₹6,249</span>
        </div>

        <button class="btn-add-cart">Add to Cart</button>
    </div>

</body>
</html>
