<!--Q19.Audit every earlier HTML file and add missing meta tags.(Made with Ai)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. Character Encoding (Prevents text display issues) -->
    <meta charset="UTF-8">

    <!-- 2. Mobile Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 3. Search Engine Optimization (SEO) -->
    <meta name="description" content="Personal Portfolio and Web Development Projects showing HTML and CSS assignments.">
    <meta name="keywords" content="HTML, CSS, Web Development, Portfolio, Projects">
    <meta name="author" content="Sudheer Kumar">
    <meta name="robots" content="index, follow">

    <!-- 4. Open Graph (OG) Meta Tags for Social Media Sharing (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:title" content="My Personal Web Project">
    <meta property="og:description" content="Check out my latest web design and development assignments.">
    <meta property="og:image" content="images/preview-banner.jpg">
    <meta property="og:type" content="website">

    <!-- 5. Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Personal Web Project">
    <meta name="twitter:description" content="Check out my latest web design and development assignments.">

    <title>Audited Page Template</title>
</head>
<body>
    <h1>Page Content Goes Here</h1>
</body>
</html>
